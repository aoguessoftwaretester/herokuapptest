name: Selenium Test Automation

on:
  pull_request:
    branches: [ "master" ]

jobs:
  selenium-testng:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 3. Install browsers
      - name: Install Chrome & Firefox
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable firefox

      # 4. Compile Selenium + TestNG tests
      - name: Compile tests
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out $(find src -name "*.java")

      # 5. Execute TestNG Suite
      - name: Run TestNG Tests
        run: |
          java -Dbrowser=$BROWSER \
               -cp "out:lib/*" \
               org.testng.TestNG testng.xml

      # 6. Upload TestNG Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ matrix.browser }}
          path: test-output
