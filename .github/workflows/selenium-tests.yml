name: Selenium TestNG Maven CI

on:
  push:
    branches: [ "branchOne" ]
  pull_request:
    branches: [ "branchOne" ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify project structure
        run: |
          pwd
          ls -la
          ls -la herokuapptest

      - name: Run Selenium TestNG tests
        working-directory: herokuapptest
        run: mvn clean test
