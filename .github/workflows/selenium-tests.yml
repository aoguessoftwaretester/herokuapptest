name: Selenium TestNG Automation

on:
  pull_request:
    branches:
      - master

jobs:
  selenium-testng:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Compile tests
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out $(find src -name "*.java")

      - name: Run TestNG
        run: |
          java -cp "out:lib/*" org.testng.TestNG testng.xml
